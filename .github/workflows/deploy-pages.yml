name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões exigidas pelo actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

# O app vive na subpasta do repositório
defaults:
  run:
    shell: bash
    working-directory: "restaurant-management-system-development (1)"

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "restaurant-management-system-development (1)/package-lock.json"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Os VITE_* abaixo são opcionais: com os secrets vazios o build funciona e
      # o app abre no modo "ativação ainda não configurada". Nunca inclua
      # VITE_APPCHECK_DEBUG_TOKEN ou segredos de servidor neste build.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ secrets.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
          VITE_LICENSE_PUBLIC_KEY_DER_BASE64: ${{ secrets.VITE_LICENSE_PUBLIC_KEY_DER_BASE64 }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "restaurant-management-system-development (1)/dist"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
